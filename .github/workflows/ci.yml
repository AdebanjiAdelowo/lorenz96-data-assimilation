name: Scientific CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt ruff
      - name: Syntax validation
        run: python -m compileall -q src tests scripts
      - name: Critical lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Numerical unit tests
        run: python -m pytest -q tests
