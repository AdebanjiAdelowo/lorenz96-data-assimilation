# Fast end-to-end pipeline check. Numbers here are NOT reported as results.
base: {K: 40, F: 8.0, dt: 0.01, t_spinup: 5.0}

lyapunov: {t_total: 5.0, tau: 0.1, delta0_norm: 1.0e-7, seed: 0}

free_forecast: {t_end: 3.0, seed: 0, ens_init_std: 1.0}

baseline: {Ne: 10, stride: 1, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 15,
           ens_init_std: 1.0, seed: 0}

ensemble_size_study: {Ne_values: [5, 10, 20], stride: 1, obs_std: 1.0, obs_interval_steps: 10,
                       n_cycles: 20, ens_init_std: 1.0, n_seeds: 2}

obs_density_study: {strides: [1, 2, 4], Ne: 20, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 20,
                     ens_init_std: 1.0, n_seeds: 2}

obs_frequency_study: {intervals: [5, 10, 20], Ne: 20, stride: 1, obs_std: 1.0, n_cycles: 20,
                       ens_init_std: 1.0, n_seeds: 2}

obs_noise_study: {stds: [0.5, 1.0, 2.0], Ne: 20, stride: 1, obs_interval_steps: 10, n_cycles: 20,
                   ens_init_std: 1.0, n_seeds: 2}

localization_study: {radii: [2.0, 4.0, 8.0], Ne: 10, stride: 1, obs_std: 1.0, obs_interval_steps: 10,
                      n_cycles: 20, ens_init_std: 1.0, n_seeds: 2}

inflation_study: {factors: [1.0, 1.1, 1.2], Ne: 10, stride: 1, obs_std: 1.0, obs_interval_steps: 10,
                   n_cycles: 20, ens_init_std: 1.0, n_seeds: 2}

failure_regime: {Ne_values: [2, 3, 5], stride: 1, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 20,
                  ens_init_std: 1.0, n_seeds: 2, loc_radius: 4.0}

repeated_seeds: {Ne: 10, stride: 1, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 20,
                  ens_init_std: 1.0, n_seeds: 3, loc_radius: 4.0}

performance: {Ne_values: [5, 10, 20], n_cycles: 10, n_repeats: 2, n_warmup: 1}
