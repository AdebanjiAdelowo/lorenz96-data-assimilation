# Moderate-scale configuration for development-grade results.
base: {K: 40, F: 8.0, dt: 0.01, t_spinup: 20.0}

lyapunov: {t_total: 20.0, tau: 0.1, delta0_norm: 1.0e-7, seed: 0}

free_forecast: {t_end: 6.0, seed: 0, ens_init_std: 1.0}

# Baseline: fully observed, Ne=20 (deliberately modest for a K=40 system, no localization/inflation)
# -- demonstrates the finite-ensemble sampling problem the later localization/inflation studies
# address, rather than a pre-tuned "success" configuration.
baseline: {Ne: 20, stride: 1, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 150,
           ens_init_std: 1.0, seed: 0}

ensemble_size_study: {Ne_values: [10, 20, 40, 80], stride: 1, obs_std: 1.0, obs_interval_steps: 10,
                       n_cycles: 150, ens_init_std: 1.0, n_seeds: 5}

# Observation-density/frequency/noise studies use Ne=40 (a "moderately working" filter at the
# baseline's other settings, see README) so each individual effect is visible without being swamped
# by the small-ensemble collapse the baseline itself demonstrates.
obs_density_study: {strides: [1, 2, 4, 8], Ne: 40, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 150,
                     ens_init_std: 1.0, n_seeds: 5}

obs_frequency_study: {intervals: [5, 10, 20, 40], Ne: 40, stride: 1, obs_std: 1.0, n_cycles: 150,
                       ens_init_std: 1.0, n_seeds: 5}

obs_noise_study: {stds: [0.25, 0.5, 1.0, 2.0, 4.0], Ne: 40, stride: 1, obs_interval_steps: 10,
                   n_cycles: 150, ens_init_std: 1.0, n_seeds: 5}

localization_study: {radii: [2.0, 4.0, 6.0, 10.0], Ne: 20, stride: 1, obs_std: 1.0,
                      obs_interval_steps: 10, n_cycles: 150, ens_init_std: 1.0, n_seeds: 5}

inflation_study: {factors: [1.0, 1.05, 1.1, 1.2, 1.5], Ne: 20, stride: 1, obs_std: 1.0,
                   obs_interval_steps: 10, n_cycles: 150, ens_init_std: 1.0, n_seeds: 5}

failure_regime: {Ne_values: [4, 6, 8, 10], stride: 1, obs_std: 1.0, obs_interval_steps: 10,
                  n_cycles: 150, ens_init_std: 1.0, n_seeds: 5, loc_radius: 4.0}

repeated_seeds: {Ne: 20, stride: 1, obs_std: 1.0, obs_interval_steps: 10, n_cycles: 150,
                  ens_init_std: 1.0, n_seeds: 10, loc_radius: 4.0}

performance: {Ne_values: [10, 20, 40, 80, 160], n_cycles: 50, n_repeats: 3, n_warmup: 1}
